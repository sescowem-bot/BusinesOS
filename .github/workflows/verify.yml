name: Verify BusinessOS
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  nextjs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install website dependencies
        id: install
        run: npm ci --no-audit --no-fund
      - name: Route audit
        run: npm run check:routes
      - name: Regression and security checks
        run: npm run verify:regressions
      - name: TypeScript
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Production build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
  deno-auth-hook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck Supabase Auth Email Hook independently
        run: deno check --node-modules-dir=auto supabase/functions/send-email/index.ts
