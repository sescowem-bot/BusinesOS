name: Verify BusinessOS
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  nextjs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install website dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Route audit
        run: npm run check:routes
      - name: Regression and security checks
        run: |
          npm run check:phase21
          npm run check:phase22
          npm run check:phase23
          npm run check:phase24
          npm run check:website
          npm run check:plans
          npm run test:accounting
          npm run check:admin-ui
          npm run check:phase26
          npm run check:branding-assets
          npm run check:phase27
          npm run check:phase28
          npm run check:phase28b
          npm run check:phase29
          npm run check:phase30
          npm run check:phase30b
          npm run check:phase30c
          npm run check:phase30d
          npm run check:phase30e
          npm run check:phase30f
          npm run check:phase30g
          npm run check:phase30h
          npm run check:phase30i
          npm run check:order-payment
          npm run check:phase30j
          npm run check:phase30k
          npm run check:branch-stock
          npm run check:phase30l
          npm run check:auth-ux
          npm run check:performance
          npm run check:phase30m
          npm run check:dashboard-support
          npm run check:phase30n-ux
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
  deno-auth-hook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck Supabase Auth Email Hook independently
        run: deno check supabase/functions/send-email/index.ts
