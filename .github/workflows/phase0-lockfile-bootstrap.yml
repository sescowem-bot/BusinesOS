name: Phase 0 lockfile bootstrap
on:
  push:
    branches:
      - security/phase0-foundations-20261022
    paths:
      - .github/workflows/phase0-lockfile-bootstrap.yml
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'sescowem-bot/BusinesOS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate exact lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile
        run: |
          test -s package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile on this review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet || git commit -m "build: lock npm dependencies for reproducible CI"
          git push origin HEAD:security/phase0-foundations-20261022
